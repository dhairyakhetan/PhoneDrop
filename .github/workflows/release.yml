# Builds PhoneDrop-Setup.exe when you publish a release on GitHub, and attaches it to that release.
# Pushing to main builds nothing.
#
# To release a new version:
#   1. github.com/dhairyakhetan/PhoneDrop -> Releases -> Draft a new release
#   2. "Choose a tag" -> type a new one, higher than the last, like v1.0.1 -> "Create new tag on publish"
#   3. Write what's new (or click "Generate release notes") -> Publish release
#   About 3 minutes later PhoneDrop-Setup.exe is on the release, and installed copies of PhoneDrop
#   show "Update available" (they check at start and every 6 hours).
#   It also gets PhoneDrop-app-<base>.json.gz: the quick update (just the app files, ~100 KB, no installer).
#   Installed copies built from the same Node version and installer take that; others get PhoneDrop-Setup.exe.
#
# Tick "Set as a pre-release" for a test build: it gets an installer too, but installed copies don't update
# to it and this link keeps giving the newest stable installer:
#   https://github.com/dhairyakhetan/PhoneDrop/releases/latest/download/PhoneDrop-Setup.exe
#
# Build failed because of a network hiccup? Actions -> the failed run -> Re-run jobs.
# Failed because of the code? Fix it on main, delete the release and its tag, and publish it again.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # attach files to the release

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}
  PRERELEASE: ${{ github.event.release.prerelease }}
  # windows-latest doesn't include NSIS (the installer maker) any more, and Chocolatey's feed timed out on the
  # first run, so use the official portable zip, checked against its SHA-256.
  NSIS: '3.11'
  NSIS_SHA256: c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4 # the commit the release's tag points at

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - run: npm ci

      # The tag is the version: v1.2.3 -> 1.2.3 (shown in the app, the exe and the installer)
      - name: Version from the tag
        run: |
          v="${TAG#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag must look like v1.2.3 (three numbers), not '$TAG'. Delete this release and its tag and make a new one."
            exit 1
          fi
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$v" ]; then
            echo "::warning::package.json says $pkg but the tag says $v. Building $v. Bump package.json to match when convenient."
          fi
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Get NSIS
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o nsis.zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/$NSIS/nsis-$NSIS.zip"
          echo "$NSIS_SHA256  nsis.zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Path nsis.zip -DestinationPath .cache -Force"
          echo "MAKENSIS=$(cygpath -w "$PWD/.cache/nsis-$NSIS/makensis.exe")" >> "$GITHUB_ENV"

      - run: npm run build

      - name: Checksums
        run: |
          test -f dist/PhoneDrop-Setup.exe # build.mjs skips the installer when NSIS is missing
          cd dist
          for f in PhoneDrop-Setup.exe PhoneDrop-app-*.json.gz; do
            sha256sum "$f" | cut -c1-64 > "$f.sha256"
            echo "$f $(cat "$f.sha256")"
          done

      - name: Attach the installer and the quick update to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/PhoneDrop-Setup.exe dist/PhoneDrop-Setup.exe.sha256 dist/PhoneDrop-app-*.json.gz dist/PhoneDrop-app-*.json.gz.sha256 --clobber

      # The app's "What's new" shows only what's above <!-- install -->, i.e. what you wrote.
      - name: Add install help to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > dist/notes.md
          if ! grep -q '<!-- install -->' dist/notes.md; then
            {
              printf '\n\n<!-- install -->\n'
              if [ "$PRERELEASE" = true ]; then
                printf '**This is a test version.** Installed copies of PhoneDrop don'\''t update to it by themselves.\n\n'
              fi
              cat .github/release-notes.md
              printf '\nBuilt from %s\n' "$(git log -1 --pretty='%h: %s')"
            } >> dist/notes.md
            gh release edit "$TAG" --notes-file dist/notes.md
          fi
